services:
  # Development server with hot reload
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "3002:3000"
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID:-G-XXXXXXXXXX}
    command: npm run dev
    restart: unless-stopped

  # Build service - builds the static site
  build:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    environment:
      - NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID:-G-XXXXXXXXXX}
    profiles:
      - build

  # Production preview - serves built files with nginx
  prod:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./out:/usr/share/nginx/html:ro
    command: >
      sh -c "echo 'server { listen 80; root /usr/share/nginx/html; index index.html; location / { try_files \$$uri \$$uri/ /index.html; } }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    profiles:
      - prod

  # Type checking service
  typecheck:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    volumes:
      - ./:/app
      - /app/node_modules
    command: npm run type-check
    profiles:
      - test
